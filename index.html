<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, useMemo } = React;

        // Firebase ESM Imports
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ============================================================================
        // 【重要】ブラウザを閉じてもデータを残すための設定
        // ご自身のFirebaseプロジェクトを作成し、以下の設定を書き換えてください。
        // ============================================================================
        const userFirebaseConfig = {
            apiKey: "AIzaSyCc1nkB7CDVU56EU2me912aSaudO39Y0pg",
  authDomain: "reboot-fit.firebaseapp.com",
  projectId: "reboot-fit",
  storageBucket: "reboot-fit.firebasestorage.app",
  messagingSenderId: "1038068068280",
  appId: "1:1038068068280:web:52b71a514713b32035e94d",
  measurementId: "G-HF070T2HWZ"
        };
        // ============================================================================

        // プレビュー環境か、ローカル環境かを判定して設定を切り替え
        const isPreviewEnv = typeof __firebase_config !== 'undefined';
        const firebaseConfig = isPreviewEnv ? JSON.parse(__firebase_config) : userFirebaseConfig;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'reboot-fit-local-app';

        let auth, db;
        // 初期設定キーのままの場合はFirebaseを初期化しない（エラー防止）
        const isFirebaseConfigured = firebaseConfig && firebaseConfig.apiKey !== "YOUR_API_KEY";
        
        if (isFirebaseConfigured) {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        }

        /**
         * 確実にアイコンを表示するためのコンポーネント
         */
        const Icon = ({ name, size = 24, className = "", strokeWidth = 2 }) => {
            const iconRef = useRef(null);

            useEffect(() => {
                const renderIcon = () => {
                    if (iconRef.current && window.lucide) {
                        iconRef.current.innerHTML = '';
                        const kebabName = name.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                        
                        const iTag = document.createElement('i');
                        iTag.setAttribute('data-lucide', kebabName);
                        iconRef.current.appendChild(iTag);

                        window.lucide.createIcons({
                            root: iconRef.current,
                            attrs: {
                                width: size,
                                height: size,
                                class: className,
                                'stroke-width': strokeWidth
                            }
                        });
                    }
                };

                renderIcon();
                const timer = setTimeout(renderIcon, 150);
                return () => clearTimeout(timer);
            }, [name, size, className, strokeWidth]);

            return (
                <span 
                    ref={iconRef} 
                    className="icon-wrapper inline-flex items-center justify-center leading-none" 
                    style={{ width: size, height: size }} 
                />
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [user, setUser] = useState(null);

            // 設定用のステート
            const [userName, setUserName] = useState('あなた');
            const [isEditingName, setIsEditingName] = useState(false);
            const [gender, setGender] = useState('男性');
            const [age, setAge] = useState('30代');
            const [bodyType, setBodyType] = useState('痩せ型');
            const [exerciseHabit, setExerciseHabit] = useState('週0回');

            // Firebase認証の設定
            useEffect(() => {
                if (!auth) return;
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (error) {
                        console.error("認証エラー:", error);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // クラウドから設定を読み込む
            useEffect(() => {
                if (!user || !db) return;
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'profile');
                
                const unsubscribe = onSnapshot(docRef, (docSnap) => {
                    if (docSnap.exists()) {
                        const data = docSnap.data();
                        if (data.userName) setUserName(data.userName);
                        if (data.gender) setGender(data.gender);
                        if (data.age) setAge(data.age);
                        if (data.bodyType) setBodyType(data.bodyType);
                        if (data.exerciseHabit) setExerciseHabit(data.exerciseHabit);
                        if (data.streak !== undefined) setStreak(data.streak);
                        if (data.totalTrainingTime !== undefined) setTotalTrainingTime(data.totalTrainingTime);
                        if (data.lastCompletedDate) setLastCompletedDate(data.lastCompletedDate);
                        if (data.todaysMenu) setTodaysMenu(data.todaysMenu);
                        if (data.historyData) setHistoryData(data.historyData);
                    } else {
                        // ドキュメントが存在しない（初回起動時）は設定タブへ案内
                        setActiveTab('settings');
                        
                        // 初期メニューを作成して保存（時間付きの動的検索リンクを適用）
                        const defaultMenu = [
                            { id: 1, title: 'ラジオ体操（第1）', desc: '4分 (全身の準備運動)', duration: 4, videoUrl: 'https://youtu.be/SGPBSqxKGAc?si=6Y0pUTFkz26dNTWd', completed: false, icon: 'Activity', iconBg: 'bg-green-50', iconColor: 'text-green-500' },
                            { id: 2, title: '壁腕立て伏せ', desc: '5回×3セット (3分)', duration: 3, videoUrl: `https://www.youtube.com/results?search_query=${encodeURIComponent('壁腕立て伏せ 3分')}`, completed: false, icon: 'PersonStanding', iconBg: 'bg-gray-100', iconColor: 'text-gray-600' },
                            { id: 3, title: 'ストレッチ', desc: '柔軟性アップ 5分', duration: 5, videoUrl: `https://www.youtube.com/results?search_query=${encodeURIComponent('ストレッチ 5分')}`, completed: false, icon: 'PersonStanding', iconBg: 'bg-purple-50', iconColor: 'text-purple-500' }
                        ];
                        setTodaysMenu(defaultMenu);
                        saveData({ 
                            todaysMenu: defaultMenu, 
                            streak: 0, 
                            totalTrainingTime: 0,
                            userName: 'あなた' 
                        });
                    }
                }, (error) => {
                    console.error("データ取得エラー:", error);
                });

                return () => unsubscribe();
            }, [user]);

            // 設定をクラウドに保存する関数
            const saveSetting = async (key, value) => {
                if (!user || !db) return;
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'profile');
                try {
                    await setDoc(docRef, { [key]: value }, { merge: true });
                } catch (error) {
                    console.error("保存エラー:", error);
                }
            };
            
            const saveData = async (data) => {
                if (!user || !db) return;
                const docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'profile');
                try {
                    await setDoc(docRef, data, { merge: true });
                } catch (error) {
                    console.error("保存エラー:", error);
                }
            };

            // 各項目の変更ハンドラ（ステート更新と同時に保存）
            const handleNameSave = () => {
                setIsEditingName(false);
                saveSetting('userName', userName);
            };
            const handleGenderChange = (val) => { setGender(val); saveSetting('gender', val); };
            const handleAgeChange = (val) => { setAge(val); saveSetting('age', val); };
            const handleBodyTypeChange = (val) => { setBodyType(val); saveSetting('bodyType', val); };
            const handleExerciseHabitChange = (val) => { setExerciseHabit(val); saveSetting('exerciseHabit', val); };

            // 記録ステート（0からスタート）
            const [streak, setStreak] = useState(0);
            const [totalTrainingTime, setTotalTrainingTime] = useState(0);
            const [lastCompletedDate, setLastCompletedDate] = useState(null);

            // カレンダー・履歴用のステート
            const [calendarView, setCalendarView] = useState('month');
            const [currentCalendarDate, setCurrentCalendarDate] = useState(new Date());
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [historyData, setHistoryData] = useState({});

            // 今日のメニューのステート管理（初期状態）
            const [todaysMenu, setTodaysMenu] = useState([]);

            // 今日の完了処理（連続達成日数のカウントアップ）
            const handleCompleteDaily = () => {
                if (completedCount < totalCount || totalCount === 0) return;

                const today = new Date().toDateString();
                if (lastCompletedDate === today) return; 

                // 連続日数の計算
                let newStreak = streak;
                if (lastCompletedDate) {
                    const lastDate = new Date(lastCompletedDate);
                    const yesterday = new Date();
                    yesterday.setDate(yesterday.getDate() - 1);
                    
                    if (lastDate.toDateString() === yesterday.toDateString()) {
                        newStreak += 1;
                    } else {
                        newStreak = 1;
                    }
                } else {
                    newStreak = 1; 
                }

                // 今日のトレーニング時間を合算
                const todaysTotalTime = todaysMenu.reduce((sum, item) => sum + (item.duration || 0), 0);
                const newTotalTime = totalTrainingTime + todaysTotalTime;

                setStreak(newStreak);
                setTotalTrainingTime(newTotalTime);
                setLastCompletedDate(today);
                
                // カレンダーのデータも更新
                const dateStr = formatDateString(new Date());
                const updatedHistory = {
                    ...historyData,
                    [dateStr]: { isPerfect: true, menu: todaysMenu }
                };
                setHistoryData(updatedHistory);

                saveData({
                    streak: newStreak,
                    totalTrainingTime: newTotalTime,
                    lastCompletedDate: today,
                    historyData: updatedHistory
                });
            };

            // メニュー提案用のステート
            const [trainingTime, setTrainingTime] = useState(15);
            const [trainingLocation, setTrainingLocation] = useState('室内');
            const [suggestedMenu, setSuggestedMenu] = useState([]);

            // メニューを生成するロジック
            const handleGenerateMenu = () => {
                // fixedVideoUrl があるものは固定リンク、無いものは時間に応じた検索リンクを生成
                const homeExercises = [
                    { title: 'スクワット', desc: '下半身の強化', type: 'reps', baseCount: 15, unit: '回', icon: 'PersonStanding', bg: 'bg-orange-50', color: 'text-orange-500' },
                    { title: 'プランク', desc: '体幹トレーニング', type: 'time', icon: 'Activity', bg: 'bg-teal-50', color: 'text-teal-500' },
                    { title: '壁腕立て伏せ', desc: '上半身の強化', type: 'reps', baseCount: 10, unit: '回', icon: 'PersonStanding', bg: 'bg-blue-50', color: 'text-blue-500' },
                    { title: 'ラジオ体操', desc: '全身の準備運動', type: 'time', fixedDuration: 4, fixedVideoUrl: 'https://youtu.be/SGPBSqxKGAc?si=6Y0pUTFkz26dNTWd', icon: 'Activity', bg: 'bg-green-50', color: 'text-green-500' },
                    { title: 'ストレッチ', desc: '柔軟性アップ', type: 'time', icon: 'PersonStanding', bg: 'bg-purple-50', color: 'text-purple-500' },
                ];
                
                const outExercises = [
                    { title: 'ウォーキング', desc: '有酸素運動', type: 'time', icon: 'Activity', bg: 'bg-blue-50', color: 'text-blue-500' },
                    { title: 'ジョギング', desc: '脂肪燃焼', type: 'time', icon: 'Activity', bg: 'bg-orange-50', color: 'text-orange-500' },
                    { title: '階段昇降', desc: '下半身と心肺機能', type: 'reps', baseCount: 20, unit: '回', icon: 'PersonStanding', bg: 'bg-teal-50', color: 'text-teal-500' },
                    { title: 'ダッシュ', desc: '瞬発力アップ', type: 'reps', baseCount: 3, unit: '本', icon: 'Activity', bg: 'bg-red-50', color: 'text-red-500' },
                ];

                let baseList = [];
                if (trainingLocation === '室内') {
                    baseList = homeExercises;
                } else if (trainingLocation === '屋外') {
                    baseList = outExercises;
                } else {
                    baseList = [...homeExercises, ...outExercises];
                }

                const shuffled = [...baseList].sort(() => 0.5 - Math.random());
                const selected = shuffled.slice(0, 3);
                
                const fixedTime = selected.reduce((sum, item) => sum + (item.fixedDuration || 0), 0);
                const flexibleItemsCount = selected.filter(item => !item.fixedDuration).length;
                let remainingTime = Math.max(flexibleItemsCount * 1, trainingTime - fixedTime);
                
                const timePerFlexible = flexibleItemsCount > 0 ? Math.floor(remainingTime / flexibleItemsCount) : 0;
                const remainder = flexibleItemsCount > 0 ? remainingTime % flexibleItemsCount : 0;

                let flexibleIndex = 0;
                const updatedSelected = selected.map((item, index) => {
                    let allocatedTime = 0;
                    if (item.fixedDuration) {
                        allocatedTime = item.fixedDuration;
                    } else {
                        allocatedTime = timePerFlexible + (flexibleIndex === 0 ? remainder : 0);
                        flexibleIndex++;
                    }
                    
                    let detailDesc = "";
                    if (item.fixedDuration) {
                        detailDesc = `${allocatedTime}分`;
                    } else if (item.type === 'reps') {
                        detailDesc = `${item.baseCount}${item.unit} × ${allocatedTime}セット`;
                    } else {
                        detailDesc = `自分のペースで ${allocatedTime}分`;
                    }

                    // 時間（duration）を用いた検索リンクの動的生成
                    const videoUrl = item.fixedVideoUrl 
                        ? item.fixedVideoUrl 
                        : `https://www.youtube.com/results?search_query=${encodeURIComponent(item.title + ' ' + allocatedTime + '分')}`;

                    return {
                        ...item,
                        id: Date.now() + index,
                        timeText: `${allocatedTime}分`,
                        duration: allocatedTime,
                        videoUrl: videoUrl,
                        desc: `${detailDesc} (${item.desc})`
                    };
                });

                setSuggestedMenu(updatedSelected);
            };

            const setAsTodaysMenu = () => {
                const newMenu = suggestedMenu.map((item, idx) => ({
                    id: Date.now() + idx,
                    title: item.title,
                    desc: item.desc,
                    duration: item.duration,
                    videoUrl: item.videoUrl,
                    completed: false,
                    icon: item.icon,
                    iconBg: item.bg,
                    iconColor: item.color
                }));
                setTodaysMenu(newMenu);
                saveData({ todaysMenu: newMenu });
                setActiveTab('home');
            };

            const toggleTask = (id) => {
                const newMenu = todaysMenu.map(task => 
                    task.id === id ? { ...task, completed: !task.completed } : task
                );
                setTodaysMenu(newMenu);
                saveData({ todaysMenu: newMenu });
            };

            const completedCount = todaysMenu.filter(t => t.completed).length;
            const totalCount = todaysMenu.length;

            const getGreeting = () => {
                const hour = new Date().getHours();
                if (hour >= 5 && hour < 11) return 'おはようございます';
                if (hour >= 11 && hour < 18) return 'こんにちは';
                return 'こんばんは';
            };

            const getDailyMessage = () => {
                const messages = [
                    "今日も自分のペースで進もう！",
                    "少しの継続が大きな力に。",
                    "無理せず、楽しく体を動かそう。",
                    "昨日の自分より一歩前へ！",
                    "休むことも大切なトレーニング。",
                    "深呼吸して、リラックスしよう。",
                    "自分を褒める一日にしよう！",
                    "小さな変化を楽しんでいこう。",
                    "焦らず、ゆっくりと着実に。",
                    "気分転換に少しだけ動こう。"
                ];
                const today = new Date();
                const dateString = `${today.getFullYear()}${today.getMonth()}${today.getDate()}`;
                let hash = 0;
                for (let i = 0; i < dateString.length; i++) {
                    hash = dateString.charCodeAt(i) + ((hash << 5) - hash);
                }
                return messages[Math.abs(hash) % messages.length];
            };

            const getDailyTip = () => {
                const tips = [
                    { title: "水分補給のタイミング", desc: "運動の30分前にはコップ1杯の水を飲みましょう。パフォーマンス低下を防ぎます。" },
                    { title: "睡眠と筋肉の関係", desc: "筋肉は寝ている間に成長します。最低でも7時間の睡眠を心がけましょう。" },
                    { title: "プロテインのゴールデンタイム", desc: "運動後30分以内は栄養の吸収率がアップ！効率よくタンパク質を補給しましょう。" },
                    { title: "ストレッチの重要性", desc: "運動後のストレッチは筋肉の緊張をほぐし、翌日の疲労回復を早めます。" },
                    { title: "正しい呼吸法", desc: "筋トレ中は「力を入れる時に息を吐き、戻す時に吸う」を意識すると効果的です。" },
                    { title: "休養日も大切", desc: "毎日鍛えるより、筋肉を休ませて回復させる日を作ることで効率よく成長します。" },
                    { title: "炭水化物もエネルギー源", desc: "タンパク質だけでなく、体を動かすエネルギー源となる炭水化物もバランス良く摂りましょう。" }
                ];
                const today = new Date();
                const dateString = `${today.getFullYear()}${today.getMonth()}${today.getDate()}`;
                let hash = 0;
                for (let i = 0; i < dateString.length; i++) {
                    hash = dateString.charCodeAt(i) + ((hash << 5) - hash);
                }
                return tips[Math.abs(hash) % tips.length];
            };

            // 設定メニュー用の項目コンポーネント
            const SettingItem = ({ iconName, title, iconBg, iconColor, hasBorder = true, onClick }) => (
                <div onClick={onClick} className={`flex items-center p-4 ${hasBorder ? 'border-b border-gray-50' : ''} bg-white active:bg-slate-50 transition-colors cursor-pointer`}>
                    <div className={`w-9 h-9 rounded-full flex items-center justify-center mr-4 shrink-0 ${iconBg} ${iconColor}`}>
                        <Icon name={iconName} size={18} />
                    </div>
                    <div className="flex-1 font-bold text-[15px] text-slate-700">
                        {title}
                    </div>
                    <Icon name="ChevronRight" size={20} className="text-gray-300 shrink-0" />
                </div>
            );

            // 設定メニュー用の選択式コンポーネント
            const SettingSelect = ({ iconName, title, value, options, onChange, iconBg, iconColor, hasBorder = true }) => (
                <div className={`flex items-center p-4 ${hasBorder ? 'border-b border-gray-50' : ''} bg-white relative hover:bg-slate-50 transition-colors`}>
                    <div className={`w-9 h-9 rounded-full flex items-center justify-center mr-4 shrink-0 ${iconBg} ${iconColor}`}>
                        <Icon name={iconName} size={18} />
                    </div>
                    <div className="flex-1 font-bold text-[15px] text-slate-700">
                        {title}
                    </div>
                    <div className="flex items-center pointer-events-none">
                        <span className="text-slate-500 text-sm mr-2">{value}</span>
                        <Icon name="ChevronRight" size={20} className="text-gray-300 shrink-0" />
                    </div>
                    <select 
                        value={value}
                        onChange={(e) => onChange(e.target.value)}
                        className="absolute inset-0 w-full h-full opacity-0 cursor-pointer appearance-none"
                    >
                        {options.map(opt => <option key={opt} value={opt}>{opt}</option>)}
                    </select>
                </div>
            );

            const getDaysInMonth = (date) => {
                const year = date.getFullYear();
                const month = date.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const days = [];
                for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
                for (let i = 1; i <= lastDay.getDate(); i++) days.push(new Date(year, month, i));
                return days;
            };

            const getDaysInWeek = (date) => {
                const days = [];
                const current = new Date(date);
                current.setDate(current.getDate() - current.getDay());
                for (let i = 0; i < 7; i++) {
                    days.push(new Date(current));
                    current.setDate(current.getDate() + 1);
                }
                return days;
            };

            const formatDateString = (date) => {
                if (!date) return '';
                return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
            };

            const shiftCalendar = (direction) => {
                const newDate = new Date(currentCalendarDate);
                if (calendarView === 'month') {
                    newDate.setMonth(newDate.getMonth() + direction);
                } else {
                    newDate.setDate(newDate.getDate() + direction * 7);
                }
                setCurrentCalendarDate(newDate);
            };

            const renderTotalTime = (totalMinutes) => {
                if (totalMinutes < 60) {
                    return (
                        <p className="text-2xl font-bold text-yellow-400 flex items-baseline">
                            {totalMinutes}<span className="text-[10px] font-medium ml-0.5">分</span>
                        </p>
                    );
                } else if (totalMinutes < 1440) {
                    const hours = Math.floor(totalMinutes / 60);
                    const mins = totalMinutes % 60;
                    return (
                        <p className="text-lg font-bold text-yellow-400 flex items-baseline whitespace-nowrap tracking-tight">
                            {hours}<span className="text-[9px] font-medium mx-0.5">時間</span>
                            {mins > 0 && <>{mins}<span className="text-[9px] font-medium ml-0.5">分</span></>}
                        </p>
                    );
                } else {
                    const days = Math.floor(totalMinutes / 1440);
                    const hours = Math.floor((totalMinutes % 1440) / 60);
                    return (
                        <p className="text-lg font-bold text-yellow-400 flex items-baseline whitespace-nowrap tracking-tight">
                            {days}<span className="text-[9px] font-medium mx-0.5">日</span>
                            {hours > 0 && <>{hours}<span className="text-[9px] font-medium ml-0.5">時間</span></>}
                        </p>
                    );
                }
            };

                const radius = size === 'sm' ? 15 : 22;

                                strokeDasharray={circumference}
